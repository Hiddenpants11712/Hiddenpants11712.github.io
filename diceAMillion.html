
<button id="playDice">Play Dice a Million</button>
<p id="status"></p>

<script>
document.getElementById("playDice").addEventListener("click", async () => {
  const status = document.getElementById("status");
  const tab = window.open("about:blank", "_blank");

  if (!tab) {
    status.textContent = "Allow pop-ups for this site, then try again.";
    return;
  }

  try {
    status.textContent = "Loading game...";

    const origin = "https://gn-math.dev";
    const dataPath =
      "/s/EE0_FEFXflkxUx5iECccXCcNRB9_GDdDXysSex5LLgFQGDgFPFIDP1U1C0ouEEEtPBc7WV82FTodSmUOQQI_.json";

    const response = await fetch(origin + dataPath + "?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Game list returned HTTP " + response.status);
    }

    const games = await response.json();
    const game = games.find(
      g => g.name?.trim().toLowerCase() === "dice a million"
    );

    if (!game || !game.url) {
      throw new Error("Dice a Million was not found in the game list.");
    }

    const coverPath =
      "/s/EE0_FEFXflkxUx5iECccXCcNRB9_GDdDXysSex5LLgFQGDgFPFIDP1U3F08uFkEtPBc7WV8/";
    const htmlPath =
      "/s/EE0_FEFXflkxUx5iECccXCcNRB9_GDdDXysSex5LLgFQGDgFPFIDP1U8DFQnJF8MOBh9/";

    const path = String(game.url)
      .replaceAll("{COVER_URL}", coverPath)
      .replaceAll("{HTML_URL}", htmlPath);

    const gameURL = new URL(path, origin).href;

    // Navigate directly so the game's own scripts and assets can load.
    tab.location.replace(gameURL);
    status.textContent = "Game opened.";

  } catch (error) {
    tab.close();
    status.textContent =
      "Could not load game: " + error.message +
      ". The source site may be blocking cross-origin requests.";
  }
});
</script>


<script>
  window.open("https://gn-math.dev/?id=759#embed", "_blank");
</script>
